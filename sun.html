
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard - Chart Palettes</title>

    <!-- Highcharts libraries -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-3d.js"></script>

    <style>
        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .chart-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .chart-card {
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            min-width: 0;
        }

        .chart {
            height: 350px;
            width: 100%;
        }

        @media (max-width: 1000px) {
            .chart-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Project Management Dashboard</h1>

    <div class="chart-container">
        <div class="chart-card">
            <div id="stageChart" class="chart"></div>
        </div>

        <div class="chart-card">
            <div id="categoryChart" class="chart"></div>
        </div>

        <div class="chart-card">
            <div id="locationChart" class="chart"></div>
        </div>
    </div>

    <script>
        // STYLE 1: Corporate Professional
        var corporateColors = [
            "#2563EB",
            "#0F766E",
            "#F59E0B",
            "#7C3AED"
        ];

        // STYLE 5: Sunset Warm
        var sunsetColors = [
            "#FF4500",
            "#FFB703",
            "#FB7185",
            "#9D4EDD"
        ];

        // STYLE 7: Nature and Earth
        var natureColors = [
            "#166534",
            "#65A30D",
            "#A16207",
            "#0F766E"
        ];

        // Common function to create a 3D pie chart
        function createPieChart(containerId, chartTitle, chartData, chartColors) {

            Highcharts.chart(containerId, {
                chart: {
                    type: "pie",
                    options3d: {
                        enabled: true,
                        alpha: 45,
                        beta: 0
                    },
                    backgroundColor: "transparent"
                },

                title: {
                    text: chartTitle,
                    style: {
                        fontSize: "17px",
                        fontWeight: "bold",
                        color: "#1f2937"
                    }
                },

                credits: {
                    enabled: false
                },

                tooltip: {
                    pointFormat: "<b>{point.y}</b> projects ({point.percentage:.1f}%)"
                },

                plotOptions: {
                    pie: {
                        depth: 40,
                        allowPointSelect: true,
                        cursor: "pointer",
                        showInLegend: true,
                        dataLabels: {
                            enabled: true,
                            format: "{point.percentage:.1f}%",
                            distance: 10,
                            style: {
                                color: "#1f2937",
                                textOutline: "none",
                                fontSize: "11px"
                            }
                        },

                        // Prevent other slices from fading on hover
                        states: {
                            inactive: {
                                enabled: false,
                                opacity: 1
                            },
                            hover: {
                                enabled: true,
                                brightness: 0,
                                halo: {
                                    size: 0
                                }
                            }
                        }
                    },

                    series: {
                        opacity: 1
                    }
                },

                colors: chartColors,

                series: [{
                    name: "Projects",
                    colorByPoint: true,
                    data: chartData
                }]
            });
        }

        // Chart 1: Project stages - STYLE 7
        createPieChart(
            "stageChart",
            "Projects by Stage - Nature",
            [
                { name: "In Progress", y: 12 },
                { name: "Planning", y: 5 },
                { name: "On Hold", y: 3 },
                { name: "Completed", y: 10 }
            ],
            natureColors
        );

        // Chart 2: Project categories - STYLE 5
        createPieChart(
            "categoryChart",
            "Projects by Category - Sunset",
            [
                { name: "IT", y: 12 },
                { name: "Construction", y: 9 },
                { name: "Research", y: 9 }
            ],
            sunsetColors
        );

        // Chart 3: Project locations - STYLE 1
        createPieChart(
            "locationChart",
            "Projects by Location - Corporate",
            [
                { name: "Pune", y: 8 },
                { name: "Mumbai", y: 7 },
                { name: "Delhi", y: 5 },
                { name: "Kolkata", y: 4 }
            ],
            corporateColors
        );
    </script>

</body>
</html>
